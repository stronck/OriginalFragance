spring.application.name=virtual

# La URL de la base de datos se obtiene de Rollout mediante DATABASE_URL.
# También se admite SPRING_DATASOURCE_URL para desarrollo local.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.show_sql=false

# Permite ejecutar data.sql después de que Hibernate cree/actualice las tablas.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Rollout proporciona PORT; 8080 queda como valor local por defecto.
server.port=8012

# Cookies de sesión apropiadas para HTTPS en Rollout.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
