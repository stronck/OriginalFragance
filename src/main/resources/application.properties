spring.application.name=virtual

# La configuración de la base de datos se obtiene mediante variables de entorno.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.show_sql=false

# Permite ejecutar data.sql después de que Hibernate cree/actualice las tablas.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Permite usar PORT si el entorno lo proporciona; 8080 queda como valor predeterminado.
server.port=${PORT:8080}

# Cookies de sesión para el entorno de pruebas.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
