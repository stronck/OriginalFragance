# Configuración principal de la tienda OriginalFragance.
spring.application.name=virtual

# PostgreSQL se configura mediante DATABASE_URL de Rollout o mediante
# las variables SPRING_DATASOURCE_* / DB_* usadas en otros entornos.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.show_sql=false

# Ejecuta .sql después de que Hibernate haya creado/actualizado las tablas.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Rollout proporciona PORT. 8080 queda como valor local predeterminado.
server.port=${PORT:8080}

# Escucha en todas las interfaces del contenedor para que Rollout pueda acceder
# al servidor HTTP.
server.address=0.0.0.0

# Rollout termina HTTPS en el proxy y reenvía la petición a Spring Boot.
server.forward-headers-strategy=framework

# La cookie de sesión debe ser segura en producción/HTTPS.
# docker-compose.yml la sobrescribe a false para desarrollo local por HTTP.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax
