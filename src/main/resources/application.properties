spring.application.name=virtual

# La configuración de la base de datos se obtiene mediante las variables
# de entorno proporcionadas por Rollout o por Docker Compose.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.show_sql=false

# Permite ejecutar data.sql después de que Hibernate cree/actualice las tablas.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Puerto interno utilizado por el contenedor en Rollout.
server.port=8080

# Cookies de sesión apropiadas para HTTPS en Rollout.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
